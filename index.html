<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>耿星落</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <!-- ====== 头部：头像 + 多ID ====== -->
    <div class="header">
        <div class="avatar">
            <img src="touxiang.jpg" alt="头像">
        </div>
        <div class="id-group">
            <h1><span class="highlight">耿星落</span></h1>
            <div class="alias">
                <span>梦琳溪</span>
                <span>Star_Moon_win</span>
            </div>
        </div>
    </div>

    <!-- ====== 游戏偏好 ====== -->
    <div class="games-section">
        <div class="section-label">🎯 主玩游戏</div>
        <div class="game-duo">
            <!-- MC 卡片 -->
            <div class="game-card game-mc">
                <div class="g-header">
                    <span class="g-icon">⛏️</span>
                    <span class="g-name">我的世界</span>
                </div>
                <div class="g-desc">
                    建筑 & 生电 & 整合包爱好者<br>喜欢研究机械动力
                </div>
                <div class="g-tags">
                    <span class="g-tag"># 机械动力</span>
                    <span class="g-tag"># 建筑党</span>
                </div>
            </div>

            <!-- CS2 卡片（已添加标签） -->
            <div class="game-card game-cs">
                <div class="g-header">
                    <span class="g-icon">🔫</span>
                    <span class="g-name">CS2</span>
                </div>
                <div class="g-desc">
                    A1&A4双修玩家<br>R8爱好者，道具大师
                </div>
                <div class="g-tags">
                    <span class="g-tag"># R8</span>
                    <span class="g-tag"># 混子</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== MC服务器状态查询（固定IP，自动查询） ====== -->
    <div class="games-section" style="margin-top: 10px;">
        <div class="section-label">🟢 服务器状态</div>
        <div class="server-card">
            <!-- ★★★ 固定服务器 IP，用户不可修改 ★★★ -->
            <input type="hidden" id="serverIp" value="play.simpfun.cn:10878">
            <div class="server-input-group" style="justify-content: center;">
                <button class="btn-mc" onclick="queryServer()" style="width: auto; min-width: 140px;">🔄 刷新状态</button>
                <span style="color: #5a7a5a; font-size: 13px; margin-left: 10px;">📍 play.simpfun.cn:10878</span>
            </div>
            <div id="status-panel">
                <div style="color: #5a7a5a; padding: 10px; text-align: center; font-size: 14px;">
                    ⏳ 正在查询服务器状态...
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 联系方式 ====== -->
    <div class="contact-section">
        <!-- QQ -->
        <div class="contact-row">
            <div class="contact-label">
                <span class="c-icon">🐧</span> QQ
            </div>
            <div class="contact-value" id="qqDisplay">2025612615</div>
            <button class="btn-copy" onclick="copyText('qqDisplay', '✅ QQ号已复制！')">📋 复制</button>
        </div>
        <!-- 邮箱 -->
        <div class="contact-row">
            <div class="contact-label">
                <span class="c-icon">✉️</span> 邮箱
            </div>
            <div class="contact-value" id="emailDisplay">2025612615@qq.com</div>
            <button class="btn-copy" onclick="copyText('emailDisplay', '✅ 邮箱已复制！')">📋 复制</button>
        </div>
        <!-- B站 -->
        <div class="contact-row">
            <div class="contact-label">
                <span class="c-icon">📺</span> B站
            </div>
            <div style="flex:1;"></div>
            <a href="https://space.bilibili.com/129101104" target="_blank" class="btn-copy" style="text-decoration: none; display: inline-flex; align-items: center; gap:6px;">
                🚀 前往B站主页
            </a>
        </div>
        <!-- 抖音号1：游戏号 -->
        <div class="contact-row">
            <div class="contact-label">
                <span class="c-icon">🎵</span> 抖音🎮
            </div>
            <div style="flex:1;"></div>
            <a href="https://v.douyin.com/xNXOiboBcwQ/" target="_blank" class="btn-copy" style="text-decoration: none; display: inline-flex; align-items: center; gap:6px;">
                🎬 游戏主页：梦琳溪
            </a>
        </div>
        <!-- 抖音号2：日常号 -->
        <div class="contact-row">
            <div class="contact-label">
                <span class="c-icon">🎵</span> 抖音📷
            </div>
            <div style="flex:1;"></div>
            <a href="https://v.douyin.com/_ik8lTXljMg/" target="_blank" class="btn-copy" style="text-decoration: none; display: inline-flex; align-items: center; gap:6px;">
                🎬 日常主页：耿星落
            </a>
        </div>
    </div>

    <!-- ====== 底部（已添加更新时间） ====== -->
    <div class="footer">
        ✦ 随时在线 · 欢迎加好友一起玩 ✦
        <br>
        <span style="font-size: 10px; color: #3a4a4a;">📅 最后更新：2026年8月</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
